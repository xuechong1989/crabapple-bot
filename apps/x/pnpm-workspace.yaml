packages:
  - apps/*
  - packages/*

allowBuilds:
  baileys: true
  core-js: true
  electron: true
  electron-winstaller: true
  esbuild: true
  fs-xattr: true
  macos-alias: true
  node-pty: true
  protobufjs: true
  uiohook-napi: true

blockExoticSubdeps: false

overrides:
  vscode-jsonrpc: 8.2.0
  # Security backports requested by Dependabot alerts.
  proxy-addr: 2.0.8
  axios: 1.20.0
  fast-uri: 3.1.8
  undici: 7.29.1
  sharp: 0.35.5
  source-map-js: 1.2.2
  "@xmldom/xmldom": 0.9.12
  tar: 7.5.21
  shell-quote: 1.11.0
  prosemirror-model: 1.25.12
  prosemirror-view: 1.42.3

# langium imports vscode-jsonrpc/lib/common/events.js but doesn't declare the
# dependency (it only gets it transitively via vscode-languageserver), which
# breaks resolution under pnpm's strict layout. Graft it on.
packageExtensions:
  langium:
    dependencies:
      vscode-jsonrpc: '*'

catalog:
  vitest: 4.1.7

onlyBuiltDependencies:
  - baileys
  - core-js
  - electron
  - electron-winstaller
  - esbuild
  - fs-xattr
  - macos-alias
  - protobufjs
